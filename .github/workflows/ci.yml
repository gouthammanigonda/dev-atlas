name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — Lint & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build production bundle
        run: npm run build
        env:
          # Use a placeholder URL so Vite can resolve the env var during CI build.
          # The real URL is configured in Vercel's project settings.
          VITE_API_BASE_URL: https://placeholder.api/api

  # ── Backend ─────────────────────────────────────────────────────────────────
  backend:
    name: Backend — Install & Verify
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Verify server starts
        # Starts the server with dummy env vars for 3 seconds to verify it
        # boots without crashing (before the DB connection is attempted).
        # The process is expected to exit after the timeout.
        run: |
          timeout 5s node -e "
            process.env.NEO4J_URI = 'neo4j+s://ci-placeholder.io';
            process.env.NEO4J_USERNAME = 'neo4j';
            process.env.NEO4J_PASSWORD = 'placeholder';
            process.env.NODE_ENV = 'production';
            import('./app.js').then(m => {
              const app = m.default;
              const server = app.listen(3999, () => {
                console.log('✅ Server started on port 3999');
                server.close();
                process.exit(0);
              });
            });
          " || true
